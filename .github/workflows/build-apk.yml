name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FridgeFlats-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publish the APK as a release so it can be downloaded straight to a phone.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FridgeFlats.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" FridgeFlats.apk \
            --repo "${{ github.repository }}" \
            --title "Fridge Flats (build ${{ github.run_number }})" \
            --notes "Download FridgeFlats.apk below and open it on your Android phone." \
            --latest
